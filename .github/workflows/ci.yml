name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc -b
      - run: yarn test --run

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true # deuda preexistente (~67 errores) — ver docs/usefull/tasks.md. No bloquea merges todavía.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true # informativo: no bloquea merges, ver el reporte en los logs del job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn audit --level high
